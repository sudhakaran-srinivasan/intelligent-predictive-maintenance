[project]
name = "intelligent-predictive-maintenance"
version = "0.1.0"
description = "End-to-end predictive maintenance for turbofan engines using machine learning, deep learning, and Remaining Useful Life prediction."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "shap>=0.46,<0.52",
    "torch>=2.5,<3",
    "xgboost>=2.1,<3",
]